<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="./image-slot.js"></script>
<style>
  @font-face { font-family: 'Cafe24SsurroundAir'; src: url('https://gcore.jsdelivr.net/gh/projectnoonnu/noonfonts_2105_2@1.0/Cafe24SsurroundAir.woff') format('woff'); font-weight: normal; font-style: normal; font-display: swap; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; }
  a { color: #22A94D; text-decoration: none; }
  @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes pulseRing { 0% { transform: scale(0.9); opacity: 0.55; } 70% { transform: scale(1.35); opacity: 0; } 100% { opacity: 0; } }
  @keyframes suckIn {
    0%   { transform: translate(var(--sx), var(--sy)) scale(1) rotate(var(--r)); opacity: 0; }
    9%   { opacity: 1; }
    70%  { transform: translate(calc(var(--sx) * 0.14), calc(var(--sy) * 0.14)) scale(0.5) rotate(0deg); opacity: 1; }
    90%  { transform: translate(0, 4px) scale(0.14); opacity: 0.7; }
    100% { transform: translate(0, 8px) scale(0); opacity: 0; }
  }
  @keyframes piggyPop { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-6px) scale(1.03); } }
  @keyframes dotFade { 0%,80%,100% { opacity: 0.25; } 40% { opacity: 1; } }
  @keyframes barSlide { 0% { left: -40%; } 100% { left: 100%; } }
</style>
</helmet>
<div style="width:390px; height:844px; background:#fff; margin:0 auto; font-family:'Cafe24SsurroundAir', Pretendard, -apple-system, sans-serif; color:#1E2124; display:flex; flex-direction:column; position:relative; overflow:hidden;">

  <div style="flex:none; height:44px; display:flex; align-items:center; justify-content:space-between; padding:0 22px; font-weight:600; font-size:15px;">
    <span>9:41</span>
    <div style="width:17px; height:11px; border:1.5px solid #1E2124; border-radius:3px; position:relative;"><div style="position:absolute; inset:1.5px; width:9px; background:#1E2124; border-radius:1px;"></div></div>
  </div>

  <div style="flex:none; padding:52px 34px 0;">
    <div style="font-size:26px; font-weight:800; line-height:1.35;">연금 계좌에<br>연동하고 있어요</div>
    <div style="display:flex; align-items:center; gap:8px; margin-top:12px;">
      <span style="font-size:15px; font-weight:600; color:#9AA0A6;">조금만 기다려주세요</span>
      <span style="display:flex; gap:4px;">
        <span style="width:5px; height:5px; border-radius:50%; background:#22A94D; animation:dotFade 1.4s infinite; animation-delay:0s;"></span>
        <span style="width:5px; height:5px; border-radius:50%; background:#22A94D; animation:dotFade 1.4s infinite; animation-delay:0.2s;"></span>
        <span style="width:5px; height:5px; border-radius:50%; background:#22A94D; animation:dotFade 1.4s infinite; animation-delay:0.4s;"></span>
      </span>
    </div>
  </div>

  <div style="flex:1; display:flex; align-items:center; justify-content:center; padding:20px 0 40px;">

    

  <div style="position:relative; width:330px; height:440px;">

      <!-- flying bank logos -->
      <div style="position:absolute; left:137px; top:250px; width:56px; height:56px; --sx:-118px; --sy:-215px; --r:-16deg; animation:suckIn 3s cubic-bezier(0.5,0,0.85,0.3) infinite; animation-delay:0s;">
        <image-slot id="bank1" style="width:56px;height:56px;background:transparent" shape="rect" fit="contain" placeholder="콕뱅킹 로고"></image-slot>
      </div>
      <div style="position:absolute; left:137px; top:250px; width:56px; height:56px; --sx:8px; --sy:-245px; --r:12deg; animation:suckIn 3s cubic-bezier(0.5,0,0.85,0.3) infinite; animation-delay:1s;">
        <image-slot id="bank2" style="width:56px;height:56px;background:transparent" shape="rect" fit="contain" placeholder="신한은행 로고"></image-slot>
      </div>
      <div style="position:absolute; left:137px; top:250px; width:56px; height:56px; --sx:126px; --sy:-205px; --r:18deg; animation:suckIn 3s cubic-bezier(0.5,0,0.85,0.3) infinite; animation-delay:2s;">
        <image-slot id="bank3" style="width:56px;height:56px;background:transparent" shape="rect" fit="contain" placeholder="KB국민은행 로고"></image-slot>
      </div>

      <!-- piggy bank -->
      

    <image-slot id="piggy" src="./piggy_clean.png" style="width: 200px; height: 200px; background: transparent; position: absolute; left: 60px; top: 200px" shape="rect" fit="contain" placeholder="돼지저금통 이미지"></image-slot></div></div>

  <div style="flex:none; padding:0 34px 40px;">
    <div style="position:relative; height:6px; border-radius:99px; background:#EEF0F2; overflow:hidden;">
      <div style="position:absolute; top:0; width:40%; height:100%; border-radius:99px; background:#22A94D; animation:barSlide 1.5s ease-in-out infinite;"></div>
    </div>
    <div style="text-align:center; font-size:12.5px; font-weight:600; color:#B0B5BB; margin-top:14px; line-height:1.5;">안전하게 암호화된 통신으로 연결하고 있어요</div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}"></script>
</body>
</html>
