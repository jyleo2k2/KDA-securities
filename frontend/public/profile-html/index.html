<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Cafe24SsurroundAir';
    src: url('https://gcore.jsdelivr.net/gh/projectnoonnu/noonfonts_2105_2@1.0/Cafe24SsurroundAir.woff') format('woff');
    font-weight: normal;
    font-style: normal;
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  a { color: #007848; text-decoration: none; }
  a:hover { color: #18A860; }
  @media (max-width: 480px) {
    #profile-phone-stage { min-height: 100dvh !important; padding: 0 !important; background: #fff !important; }
    #profile-phone { width: 100vw !important; height: 100dvh !important; border-radius: 0 !important; box-shadow: none !important; }
  }
</style>
</helmet>
<div id="profile-phone-stage" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #E8E8DD; font-family: 'Cafe24SsurroundAir', 'Noto Sans KR', sans-serif; padding: 40px;">
  <div id="profile-phone" style="width: min(100%, 390px); height: min(844px, calc(100dvh - 80px)); min-height: 640px; background: #ffffff; border-radius: 44px; box-shadow: 0 24px 70px rgba(0,0,0,0.16); display: flex; flex-direction: column; overflow: hidden; position: relative;">

    <!-- status bar (Figma StatusBar: 다이나믹 아일랜드형) -->
    <div style="flex: none; display: flex; align-items: center; justify-content: space-between; height: 54px; padding: 0 26px 0 29px; font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 600; font-size: 15px; color: #111;">
      <span style="letter-spacing: -0.24px; font-variant-numeric: tabular-nums;">9:41</span>
      <div style="position: relative; flex: none; width: 108px; height: 32px; border-radius: 999px; background: #000;"><div style="position: absolute; top: 50%; right: 11px; width: 10px; height: 10px; border-radius: 50%; background: #01031a; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06); transform: translateY(-50%);"></div></div>
      <div style="display: flex; align-items: center; gap: 7px;">
        <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M8.5 2.4c2.6 0 5 1 6.8 2.7l1.4-1.5A11.6 11.6 0 0 0 8.5.4 11.6 11.6 0 0 0 .3 3.6l1.4 1.5A9.6 9.6 0 0 1 8.5 2.4Z" fill="#111"></path><path d="M8.5 6.1c1.6 0 3 .6 4.1 1.7l1.4-1.5a8 8 0 0 0-11 0l1.4 1.5A5.8 5.8 0 0 1 8.5 6.1Z" fill="#111"></path><path d="M8.5 9.7 10.7 7.4a4.2 4.2 0 0 0-4.4 0L8.5 9.7Z" fill="#111"></path></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".75" y=".75" width="21.5" height="10.5" rx="2.75" stroke="#111" stroke-opacity=".35" stroke-width="1.5"></rect><path d="M23.25 4v4c.8-.35 1.25-1.1 1.25-2s-.45-1.65-1.25-2Z" fill="#111" opacity=".4"></path><rect x="2.5" y="2.5" width="18.5" height="7" rx="1.5" fill="#111"></rect></svg>
      </div>
    </div>

    <!-- header -->
    <div style="display: flex; align-items: center; gap: 12px; padding: 14px 22px 4px;">
      <button type="button" data-profile-html-back aria-label="뒤로 가기" style="border: 0; padding: 0; background: none; font-family: inherit; font-size: 26px; font-weight: 900; color: #111; line-height: 1; cursor: pointer;">‹</button>
      <span style="font-size: 21px; font-weight: 900; color: #111;">내 페이지</span>
    </div>

    <!-- body -->
    <div style="flex: 1; overflow-y: auto; padding: 12px 22px 40px;">

      <!-- profile row -->
      <div style="padding: 14px 4px 22px;">
        <div style="display: flex; align-items: center; gap: 14px;">
          <span style="width: 60px; height: 60px; border-radius: 50%; background: #fff; border: 1.5px solid #EAEDE7; flex-shrink: 0; overflow: hidden; display: block;">
            <img src="./assets/profile-icon.png" alt="프로필" style="width: 100%; height: 100%; object-fit: cover; display: block;">
          </span>
          <p data-profile-name style="font-size: 20px; font-weight: 900; color: #111; margin: 0; line-height: 1.3; flex: 1; min-width: 0;">연금 사용자</p>
          <button style="flex-shrink: 0; border: 1.5px solid #EAEDE7; background: #fff; color: #18A860; font-family: inherit; font-size: 13px; font-weight: 800; padding: 9px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap;">개인정보 변경</button>
        </div>
        <p data-profile-email style="font-size: 13px; font-weight: 500; color: #8A9691; margin: 12px 0 0 74px;">로그인 정보 확인 중</p>
      </div>

      <!-- stat cards -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px;">
        <div style="border: 1.5px solid #EAEDE7; border-radius: 18px; padding: 16px 16px; background: #F5FAF6;">
          <p style="font-size: 12px; font-weight: 700; color: #8A9691; margin: 0;">계좌 데이터</p>
          <p data-profile-boundary style="font-size: 20px; font-weight: 900; color: #18A860; margin: 8px 0 0; letter-spacing: -0.5px;">확인 중</p>
        </div>
        <div style="border: 1.5px solid #EAEDE7; border-radius: 18px; padding: 16px 16px; background: #FFF9E8; width: 173px; height: 83px">
          <p style="font-size: 12px; font-weight: 700; color: #8A9691; margin: 0;">정보 기준일</p>
          <p data-profile-as-of style="font-size: 18px; font-weight: 900; color: #E8A600; margin: 8px 0 0; letter-spacing: -0.5px; width: 141px; height: 58px">-</p>
        </div>
      </div>

      <!-- investor profile banner -->
      <div style="border: 1.5px solid #EAEDE7; border-radius: 18px; padding: 16px 18px; background: #164A32; margin-bottom: 18px; display: flex; align-items: center; gap: 14px;">
        <div style="flex: 1; min-width: 0;">
          <p style="font-size: 12px; font-weight: 700; color: #9DC2AD; margin: 0;">투자자 성향</p>
          <p data-profile-risk style="font-size: 22px; font-weight: 900; color: #fff; margin: 6px 0 0; letter-spacing: -0.5px;">진단 전</p>
          <p style="font-size: 11px; font-weight: 500; color: #9DC2AD; margin: 6px 0 0;">일반금융소비자 투자성향 진단 기준</p>
        </div>
        <span style="flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 3px;"><span style="font-size: 13px; font-weight: 800; color: #164A32; background: #FFD860; padding: 8px 12px; border-radius: 999px; white-space: nowrap;">진단 다시하기</span><span style="font-size: 10px; font-weight: 500; color: #9DC2AD; white-space: nowrap;">하루 3회 가능</span></span>
      </div>

      <!-- menu list -->
      <div style="border: 1.5px solid #EAEDE7; border-radius: 22px; overflow: hidden;">
        <button style="width: 100%; border: none; background: #fff; font-family: inherit; text-align: left; display: flex; align-items: center; gap: 12px; padding: 18px 20px; cursor: pointer; border-bottom: 1px solid #F0F1EC;">
          <span style="flex: 1; font-size: 16px; font-weight: 700; color: #333;">앱 설정</span>
          <span style="font-size: 18px; color: #C4CBC6;">›</span>
        </button>
        <button style="width: 100%; border: none; background: #fff; font-family: inherit; text-align: left; display: flex; align-items: center; gap: 12px; padding: 18px 20px; cursor: pointer; border-bottom: 1px solid #F0F1EC;">
          <span style="flex: 1; font-size: 16px; font-weight: 700; color: #333;">인증 / 보안</span>
          <span style="font-size: 18px; color: #C4CBC6;">›</span>
        </button>
        <button style="width: 100%; border: none; background: #fff; font-family: inherit; text-align: left; display: flex; align-items: center; gap: 12px; padding: 18px 20px; cursor: pointer; border-bottom: 1px solid #F0F1EC;">
          <span style="flex: 1; font-size: 16px; font-weight: 700; color: #333;">ID / 비밀번호 관리</span>
          <span style="font-size: 18px; color: #C4CBC6;">›</span>
        </button>
        <button style="width: 100%; border: none; background: #fff; font-family: inherit; text-align: left; display: flex; align-items: center; gap: 12px; padding: 18px 20px; cursor: pointer; border-bottom: 1px solid #F0F1EC;">
          <span style="flex: 1; font-size: 16px; font-weight: 700; color: #333;">채팅 기록</span>
          <span style="font-size: 18px; color: #C4CBC6;">›</span>
        </button>
        <button type="button" data-profile-html-sign-out style="width: 100%; border: none; background: #fff; font-family: inherit; text-align: left; display: flex; align-items: center; gap: 12px; padding: 18px 20px; cursor: pointer;">
          <span style="flex: 1; font-size: 16px; font-weight: 800; color: #D94841;">로그아웃</span>
          <span style="font-size: 18px; color: #D94841;">›</span>
        </button>
      </div>

    </div>
  </div>
</div>
</x-dc>
</body>
</html>
