<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="슬랑이">

<title>슬랑이</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    user-select: none; touch-action: none;
    -webkit-user-select: none;
  }
  /* ── 폰 프레임 무대: main-home 규격에 픽셀 고정(다른 라우트와 동일) ── */
  body {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 40px;
    background: #e8e8dd;
  }
  /* ── 앱 셸 ── */
  #app {
    width: min(100%, 390px);
    height: min(844px, calc(100dvh - 80px));
    min-height: 640px;
    border-radius: 44px;
    box-shadow: 0 24px 70px rgba(0, 0, 0, .16);
    overflow: hidden;
    background: radial-gradient(circle at 50% 35%, #FFF6D9 0%, #FFE9A8 45%, #F7D778 100%);
    display: flex; flex-direction: column;
  }
  @media (max-width: 480px) {
    body { padding: 0; background: #fff; }
    #app { width: 100%; height: 100dvh; min-height: 0; border-radius: 0; box-shadow: none; }
  }
  /* ── iOS 상태바(Figma StatusBar: 다이나믹 아일랜드 + 신호·Wi-Fi·배터리) ── */
  #ios-statusbar {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    height: 54px; padding: 0 26px 0 29px;
    font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-weight: 600; font-size: 15px; color: #1a1200;
  }
  #ios-statusbar .isb-time { letter-spacing: -0.24px; font-variant-numeric: tabular-nums; }
  #ios-statusbar .isb-island {
    position: relative; flex: none; width: 108px; height: 32px;
    border-radius: 999px; background: #000;
  }
  #ios-statusbar .isb-lens {
    position: absolute; top: 50%; right: 11px; width: 10px; height: 10px;
    border-radius: 50%; background: #01031a;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06); transform: translateY(-50%);
  }
  #ios-statusbar .isb-icons { display: flex; align-items: center; gap: 7px; }
  #appbar {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    padding: 16px 20px 8px;
  }
  #appbar h1 {
    margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.03em;
    color: #4A3300;
  }
  #main {
    flex: 1 1 auto; min-height: 0;
    display: flex; align-items: center; justify-content: center;
  }
  /* ── 하단 도크 ── */
  #dock {
    flex: 0 0 auto;
    margin: 0 12px 12px;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom) * 0.3);
    background: none;
    display: flex; gap: 10px;
  }
  #stage {
    perspective: 760px;
    perspective-origin: 50% 50%;
    width: 100%; max-width: 460px; aspect-ratio: 1/1;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  #piggy-wrap {
    position: relative;
    width: 78%;
    transform-style: preserve-3d;
    will-change: transform;
  }
  #shadow {
    position: absolute; left: 50%; bottom: -8%;
    width: 62%; height: 9%;
    background: radial-gradient(ellipse at center, rgba(120,80,0,.34) 0%, rgba(120,80,0,0) 70%);
    transform: translate(-50%,0) translateZ(-60px);
  }
  #piggy {
    display: block; width: 100%; height: auto;
    transform: translateZ(46px);
    position: relative; z-index: 3;
    pointer-events: none;
  }
  #shade {
    position: absolute; inset: 0;
    pointer-events: none; z-index: 4;
    transform: translateZ(47px);
    mix-blend-mode: multiply;
    opacity: .9;
  }
  #ao {
    position: absolute; inset: 0;
    background: linear-gradient(to top,
                rgba(120,60,0,.55) 0%, rgba(120,60,0,.18) 28%, rgba(120,60,0,0) 55%);
    mix-blend-mode: multiply;
    transform: translateZ(48px);
    pointer-events: none; z-index: 4;
  }
  #beads, #grain {
    position: absolute; inset: 0;
    pointer-events: none; z-index: 4;
    transform: translateZ(49px);
    background-repeat: repeat;
  }
  #beads { mix-blend-mode: overlay; opacity: .85; }
  #grain { mix-blend-mode: soft-light; opacity: .55; }
  #sparkle {
    position: absolute; inset: 0;
    pointer-events: none; z-index: 5;
    transform: translateZ(51px);
    mix-blend-mode: screen;
    background-repeat: repeat;
    opacity: 0;
  }
  #spec {
    position: absolute; inset: 0;
    mix-blend-mode: screen;
    transform: translateZ(50px);
    pointer-events: none; z-index: 4;
    opacity: .85;
  }
  #rim {
    position: absolute; inset: 6% 8% 10% 8%;
    border-radius: 50% 50% 46% 46% / 52% 52% 48% 48%;
    box-shadow: inset 0 -26px 34px rgba(190,110,0,.30),
                inset 0 18px 28px rgba(255,240,200,.22);
    transform: translateZ(46px);
    pointer-events: none;
    opacity: .75;
  }
  #gloss {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 38% 26% at 34% 22%, rgba(255,255,255,.85) 0%, rgba(255,255,255,0) 70%),
      linear-gradient(115deg, rgba(255,255,255,0) 35%, rgba(255,255,255,.45) 50%, rgba(255,255,255,0) 65%);
    mix-blend-mode: screen;
    transform: translateZ(52px);
    opacity: 0;
    pointer-events: none;
    border-radius: 45%;
  }
  .depth { position: absolute; left: 0; top: 0; width: 100%; height: auto; pointer-events: none; }
  button {
    flex: 1 1 0; min-width: 0; max-width: 260px; margin: 0 auto;
    font: inherit; font-weight: 800; font-size: 13px; letter-spacing: -.02em;
    padding: 13px 6px; border-radius: 18px; border: none;
    background: rgba(255,255,255,.85); color: #4A3300; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    box-shadow: 0 2px 8px rgba(140,100,0,.12);
    transition: transform .12s cubic-bezier(.22,1,.36,1), background .12s;
  }
  button .ic { font-size: 19px; line-height: 1; }
  button:active { transform: scale(.94); background: rgba(255,255,255,1); }
  button.primary { background: #FFC916; color: #4A3300; box-shadow: 0 3px 12px rgba(230,170,0,.4); }
  #hint {
    flex: 0 0 auto; text-align: center;
    font-size: 11.5px; color: rgba(107,74,0,.6);
    padding: 0 20px 8px; letter-spacing: -.01em;
  }
</style>

<script>
/* 홈 화면에 추가하면 앱처럼 전체화면 실행 */
(function(){
  const icon = document.getElementById('piggy').src;
  const mf = {
    name: "슬랑이", short_name: "슬랑이",
    display: "standalone", orientation: "portrait",
    background_color: "#FFE9A8", theme_color: "#FFE9A8",
    start_url: ".",
    icons: [{ src: icon, sizes: "512x512", type: "image/png", purpose: "any" }]
  };
  document.getElementById('manifest').href =
    URL.createObjectURL(new Blob([JSON.stringify(mf)], {type:'application/json'}));
})();

/* 브라우저 기본 제스처 차단 (앱 느낌) */
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault(), {passive:false});
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, {passive:false});

(function(){
  const wrap = document.getElementById('piggy-wrap');
  const gloss = document.getElementById('gloss');
  const shadow = document.getElementById('shadow');
  const stage = document.getElementById('stage');
  const piggy = document.getElementById('piggy');
  const spec = document.getElementById('spec');
  const beadsEl = document.getElementById('beads');
  const grainEl = document.getElementById('grain');
  const sparkleEl = document.getElementById('sparkle');
  const shade = document.getElementById('shade');

  /* ---------- 크런치 질감: 폼비즈 텍스처를 캔버스로 생성 ---------- */
  function makeBeads(size, count){
    const cv = document.createElement('canvas');
    cv.width = cv.height = size;
    const x = cv.getContext('2d');
    x.fillStyle = 'rgba(128,128,128,1)';   // overlay 블렌드에서 중립색
    x.fillRect(0,0,size,size);
    for (let i=0;i<count;i++){
      const cx = Math.random()*size, cy = Math.random()*size;
      const r = 1.6 + Math.pow(Math.random(), 2.2) * 6.5;
      // 알갱이 몸통 (밝게 볼록)
      const g = x.createRadialGradient(cx - r*0.35, cy - r*0.4, r*0.1, cx, cy, r);
      g.addColorStop(0,   'rgba(255,255,255,0.95)');
      g.addColorStop(0.45,'rgba(200,200,200,0.55)');
      g.addColorStop(0.82,'rgba(96,96,96,0.55)');
      g.addColorStop(1,   'rgba(48,40,20,0.70)');
      x.fillStyle = g;
      x.beginPath(); x.arc(cx, cy, r, 0, 6.2832); x.fill();
      // 하이라이트 점
      x.fillStyle = 'rgba(255,255,255,0.9)';
      x.beginPath(); x.arc(cx - r*0.34, cy - r*0.38, Math.max(0.5, r*0.20), 0, 6.2832); x.fill();
    }
    // 가장자리 이음새 완화용 살짝 흐림
    return cv.toDataURL('image/png');
  }

  function makeGrain(size){
    const cv = document.createElement('canvas');
    cv.width = cv.height = size;
    const x = cv.getContext('2d');
    const img = x.createImageData(size, size);
    for (let i=0;i<img.data.length;i+=4){
      const n = 110 + (Math.random()*80)|0;
      img.data[i]=img.data[i+1]=img.data[i+2]=n;
      img.data[i+3]=255;
    }
    x.putImageData(img,0,0);
    return cv.toDataURL('image/png');
  }

  function makeSparkle(size, count){
    const cv = document.createElement('canvas');
    cv.width = cv.height = size;
    const x = cv.getContext('2d');
    x.clearRect(0,0,size,size);
    for (let i=0;i<count;i++){
      const cx = Math.random()*size, cy = Math.random()*size;
      const r = 0.8 + Math.random()*2.2;
      const g = x.createRadialGradient(cx,cy,0,cx,cy,r*3);
      g.addColorStop(0,'rgba(255,255,255,1)');
      g.addColorStop(0.3,'rgba(255,246,200,0.6)');
      g.addColorStop(1,'rgba(255,255,255,0)');
      x.fillStyle=g;
      x.beginPath(); x.arc(cx,cy,r*3,0,6.2832); x.fill();
    }
    return cv.toDataURL('image/png');
  }

  function applyTextures(){
    const mask = `url("${piggy.src}")`;
    [beadsEl, grainEl, sparkleEl, spec, shade, document.getElementById('ao'), gloss].forEach(el => {
      el.style.webkitMaskImage = mask;  el.style.maskImage = mask;
      el.style.webkitMaskSize = '100% 100%'; el.style.maskSize = '100% 100%';
      el.style.webkitMaskRepeat = 'no-repeat'; el.style.maskRepeat = 'no-repeat';
    });
    beadsEl.style.backgroundImage = `url("${makeBeads(240, 900)}")`;
    beadsEl.style.backgroundSize = '30% 30%';
    grainEl.style.backgroundImage = `url("${makeGrain(128)}")`;
    grainEl.style.backgroundSize = '22% 22%';
    sparkleEl.style.backgroundImage = `url("${makeSparkle(200, 90)}")`;
    sparkleEl.style.backgroundSize = '38% 38%';
  }

  /* ---------- 2.5D 압출: 같은 실루엣을 뒤로 여러 겹 ---------- */
  const LAYERS = 0, THICK = 0;   // 압출 제거 — 조명/음영만으로 입체 표현   // 겹 수 / 겹 간격(px)
  const depthLayers = [];
  function buildDepth(){
    for (let i = 1; i <= LAYERS; i++){
      const c = piggy.cloneNode();
      c.id = '';
      c.className = 'depth';
      const k = i / LAYERS;                       // 0(앞) ~ 1(뒤)
      // 뒤로 갈수록 어둡게 → 단면이 그늘진 두께로 읽힘
      c.style.filter =
        `brightness(${(1 - k*0.62).toFixed(3)}) saturate(${(1 - k*0.35).toFixed(2)})` +
        (k > 0.75 ? ` blur(${((k-0.75)*3).toFixed(1)}px)` : '');
      c.style.zIndex = String(3 - i);
      c.dataset.k = k;
      c.dataset.i = i;
      wrap.insertBefore(c, piggy);
      depthLayers.push(c);
    }
  }
  function initVisual(){ applyTextures(); }
  if (piggy.complete) initVisual();
  else piggy.addEventListener('load', initVisual);

  let targetX = 0, targetY = 0, curX = 0, curY = 0;
  const MAX = 26;

  /* ---------- 틸트 ---------- */
  function setTilt(nx, ny){ // -1..1
    targetY = nx * MAX;
    targetX = -ny * MAX;
  }

  /* ---------- 젤리 스프링 ---------- */
  // s = 현재 변형량(양수면 납작, 음수면 길쭉), v = 속도
  let s = 0, v = 0;
  const STIFF = 0.045, DAMP = 0.905;  // 낮은 강성 + 높은 감쇠 = 천천히 되돌아옴
  let lagY = 0, lagX = 0;            // 몸통이 뒤늦게 따라오는 관성
  const lag = [];                    // 압출 겹별 지연 상태
  let t0 = performance.now();

  function poke(amount){ v += amount; }

  function loop(now){
    const t = (now - t0) / 1000;

    curX += (targetX - curX) * 0.055;
    curY += (targetY - curY) * 0.055;

    // 스프링 적분
    v += -s * STIFF;
    v *= DAMP;
    s += v;

    // 숨쉬듯 미세하게 부풀었다 꺼짐
    const breathe = Math.sin(t * 1.6) * 0.012;

    // 기울이면 관성으로 살짝 늘어짐 (기울기 변화량에 반응)
    const dy = curY - lagY, dx = curX - lagX;
    lagY += dy * 0.09; lagX += dx * 0.09;
    const wobble = (dy * 0.020);

    const sx = 1 + s * 0.9 + breathe * -1 + Math.abs(wobble) * 0.5;
    const sy = 1 - s * 1.1 + breathe + Math.abs(wobble) * -0.4;
    const skew = s * -4 + wobble * 18;
    // 눌릴수록 바닥에 붙는 느낌
    const drop = s * 13;

    wrap.style.transform =
      `rotateX(${curX.toFixed(2)}deg) rotateY(${curY.toFixed(2)}deg) ` +
      `translateY(${drop.toFixed(1)}px) skewX(${skew.toFixed(2)}deg) ` +
      `scale(${sx.toFixed(4)}, ${sy.toFixed(4)})`;

    const g = Math.min(1, Math.abs(curY) / MAX);
    gloss.style.opacity = (0.14 + g * 0.30 + Math.abs(s) * 1.0).toFixed(2);
    gloss.style.transform =
      `translateZ(52px) translateX(${(curY*1.6).toFixed(1)}%) scale(${(1 - s*0.5).toFixed(3)}, ${(1 + s*0.6).toFixed(3)})`;

    const px = curY / MAX;      // 좌우 기울기 -1..1
    const py = curX / MAX;      // 상하 기울기 -1..1

    /* 방향성 음영: 빛 반대편이 어두워지며 곡면을 만든다 */
    const sh = 50 + px * 55, shy = 50 + py * 55;
    shade.style.background =
      `radial-gradient(ellipse 92% 92% at ${sh.toFixed(1)}% ${shy.toFixed(1)}%,` +
      `rgba(255,255,255,0) 0%, rgba(180,110,10,.18) 46%, rgba(120,62,0,.62) 88%)`;

    /* 실루엣 가장자리 라이팅: 빛쪽은 밝은 테, 반대쪽은 짙은 테 */
    const dox = ( px * 9).toFixed(1), doy = ( py * 9 + 6).toFixed(1);
    piggy.style.filter =
      `drop-shadow(${dox}px ${doy}px 10px rgba(140,80,0,.45)) ` +
      `drop-shadow(0 ${(14 - s*10).toFixed(1)}px ${(18 + s*14).toFixed(1)}px rgba(150,100,0,.30))`;

    /* 크런치 알갱이: 눌리면 압축되고, 기울이면 표면 위를 미끄러짐 */
    const bsx = 30 * (1 + s * 0.9), bsy = 30 * (1 - s * 1.1);
    beadsEl.style.backgroundSize = `${bsx.toFixed(2)}% ${bsy.toFixed(2)}%`;
    beadsEl.style.backgroundPosition = `${(-px*4).toFixed(2)}% ${(-py*4).toFixed(2)}%`;
    beadsEl.style.opacity = (0.72 + Math.abs(s) * 2.2).toFixed(2);

    grainEl.style.backgroundPosition = `${(-px*2).toFixed(2)}% ${(-py*2).toFixed(2)}%`;

    // 알갱이 반짝임은 기울기가 클 때만 살아남
    const sp = Math.min(1, (Math.abs(px)*0.8 + Math.abs(py)*0.5));
    sparkleEl.style.opacity = (sp * 0.55 + Math.abs(s) * 1.5).toFixed(2);
    sparkleEl.style.backgroundPosition = `${(-px*9).toFixed(2)}% ${(-py*9).toFixed(2)}%`;

    /* 스펙큘러: 빛은 왼쪽 위 고정, 기울이면 표면에서 미끄러짐 */
    const lx = 34 - px * 26;
    const ly = 26 - py * 22;
    spec.style.transform =
      `translateZ(50px) translate(${(-px*3).toFixed(1)}%, ${(-py*3).toFixed(1)}%)`;
    spec.style.background =
      `radial-gradient(ellipse ${(26 + Math.abs(px)*8).toFixed(0)}% 20% at ${lx.toFixed(1)}% ${ly.toFixed(1)}%,` +
      `rgba(255,255,255,${(0.85 - Math.abs(px)*0.25).toFixed(2)}) 0%, rgba(255,255,255,.28) 42%, rgba(255,255,255,0) 74%)`;

    // 눌리면 그림자가 넓고 진해짐
    shadow.style.transform =
      `translate(calc(-50% + ${(-curY*1.2).toFixed(1)}px), 0) translateZ(-60px) scale(${(1 + s*1.4).toFixed(3)}, 1)`;
    shadow.style.opacity = (0.85 + s * 1.6).toFixed(2);

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  stage.addEventListener('pointermove', e => {
    const r = stage.getBoundingClientRect();
    setTilt((e.clientX - r.left) / r.width * 2 - 1,
            (e.clientY - r.top) / r.height * 2 - 1);
  });
  stage.addEventListener('pointerleave', () => setTilt(0,0));

  /* 모바일 자이로 */
  function enableGyro(){
    window.addEventListener('deviceorientation', e => {
      if (e.gamma == null) return;
      setTilt(Math.max(-1, Math.min(1, e.gamma / 35)),
              Math.max(-1, Math.min(1, (e.beta - 45) / 35)));
    });
  }
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    document.body.addEventListener('click', function once(){
      DeviceOrientationEvent.requestPermission().then(s => { if (s === 'granted') enableGyro(); }).catch(()=>{});
      document.body.removeEventListener('click', once);
    });
  } else { enableGyro(); }

  /* ---------- 사운드 (Web Audio 합성) ---------- */
  let ctx;
  function AC(){ if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)(); 
                 if(ctx.state==='suspended') ctx.resume(); return ctx; }

  // 꿀꿀 소리: 저역 톱니파 + 빠른 피치 벤딩
  function oink(){
    const a = AC(), t = a.currentTime;
    for (let i=0;i<2;i++){
      const s = t + i*0.16;
      const o = a.createOscillator(), g = a.createGain(), f = a.createBiquadFilter();
      o.type='sawtooth';
      o.frequency.setValueAtTime(190, s);
      o.frequency.exponentialRampToValueAtTime(340, s+0.05);
      o.frequency.exponentialRampToValueAtTime(150, s+0.13);
      f.type='lowpass'; f.frequency.setValueAtTime(1100, s); f.Q.value=6;
      g.gain.setValueAtTime(0.0001, s);
      g.gain.exponentialRampToValueAtTime(0.28, s+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, s+0.14);
      o.connect(f); f.connect(g); g.connect(a.destination);
      o.start(s); o.stop(s+0.16);
    }
  }

  // 동전 소리: 고역 삼각파 몇 개 + 짧은 노이즈
  function clink(){
    const a = AC(), t = a.currentTime;
    [2100, 3050, 4300].forEach((fr, i) => {
      const o = a.createOscillator(), g = a.createGain();
      o.type='triangle'; o.frequency.value = fr * (0.96 + Math.random()*0.09);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.13/(i+1), t+0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.35);
      o.connect(g); g.connect(a.destination);
      o.start(t); o.stop(t+0.36);
    });
  }

  // 흔들기: 동전 여러 개 랜덤 타이밍
  function rattle(){
    const n = 6 + Math.floor(Math.random()*5);
    for (let i=0;i<n;i++) setTimeout(clink, Math.random()*520);
  }

  /* ---------- 인터랙션 ---------- */
  function squish(power){ poke(power || 0.016); }

  let holding = false, holdTimer = null, holdStart = 0, pressCount = 0;
  stage.addEventListener('pointerdown', e => {
    holding = true;
    holdStart = performance.now();
    poke(0.020);
    oink();
    // 누르고 있는 동안 계속 눌려 있게 유지
    holdTimer = setInterval(()=>{
      if (!holding) return;
      v += (0.058 - s) * 0.045;
    }, 16);
  });
  function release(){
    if (!holding) return;
    holding = false;
    clearInterval(holdTimer);
    poke(-0.010);            // 손 떼면 천천히 부풀어 오름
  }
  stage.addEventListener('pointerup', release);
  stage.addEventListener('pointercancel', release);
  stage.addEventListener('pointerleave', release);

  document.getElementById('btn-shake').addEventListener('click', e => {
    e.stopPropagation();
    rattle();
    let i = 0;
    const iv = setInterval(()=>{
      setTilt(Math.sin(i*0.9)*0.9, Math.cos(i*1.3)*0.4);
      if (i % 4 === 0) poke(0.008 * (i%2 ? 1 : -1));
      if (++i > 14){ clearInterval(iv); setTilt(0,0); }
    }, 45);
  });
})();
</script>
