[project]
name = "pension-copilot"
version = "0.1.0"
description = "Explainable pension-account guidance service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.10,<3",
    "pydantic-ai-slim[anthropic]>=2.10.0",
    "pydantic-settings>=2.7,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.7.0",
    "pglast>=7.7,<8",
    "pytest>=8.3,<9",
    "ruff>=0.12,<1",
]
embeddings = [
    "sentence-transformers>=5.6.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
