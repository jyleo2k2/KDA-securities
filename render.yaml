services:
  - type: web
    name: pension-copilot-api
    runtime: python
    plan: free
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run --no-sync uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ENABLE_CLAUDE_NARRATION
        value: "false"
      # 시연·테스트 계정(설문 결과를 저장하지 않음). 값은 Render 대시보드에서 주입.
      - key: EPHEMERAL_INVESTMENT_PROFILE_OWNER_IDS
        sync: false
