services:
  - type: web
    # 실제 운영 서비스는 Render 대시보드의 `KDA-securities`
    # (srv-d9hee07lk1mc73dqomf0, https://kda-securities.onrender.com)이다.
    # 아래 name 은 초기 blueprint 값이며 대시보드 서비스명과 다르다.
    # 이름을 바꾸면 Render 가 별도 서비스를 새로 만들 수 있으므로 그대로 둔다.
    # 폐기된 옛 주소 https://pension-copilot-api.onrender.com 은 상태 확인에 쓰지 않는다.
    name: pension-copilot-api
    runtime: python
    plan: free
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run --no-sync uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # autoDeploy 가 false 이므로 main push 만으로는 코드가 갱신되지 않는다.
    # 코드 변경은 대시보드에서 Manual Deploy -> Deploy latest commit 으로 반영한다.
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # 검증 답변을 Claude가 자연어로 다시 쓰는 단계. false면 규칙 엔진의
      # 결정론 답변이 그대로 나가며 수치·출처는 동일하다. 시연 품질을 위해
      # true로 두되, 과금이 붙는 값이므로 변경 시 배포 가이드 §3-1을 따른다.
      - key: ENABLE_CLAUDE_NARRATION
        value: "true"
      # 규칙 분류기가 놓친 질문만 작은 Haiku 분류기로 되살린다. 명백한 잡담은
      # 정규식으로, 반복 질문은 캐시로 먼저 걸러서 실제 호출은 드물다.
      # 과금이 붙는 값이므로 변경 시 배포 가이드 §3-1을 따른다.
      - key: ENABLE_CLAUDE_TOPIC_GUARD
        value: "true"
      # 시연·테스트 계정(설문 결과를 저장하지 않음). 값은 Render 대시보드에서 주입.
      - key: EPHEMERAL_INVESTMENT_PROFILE_OWNER_IDS
        sync: false
      - key: GOOGLE_API_KEY
        value: "true"
