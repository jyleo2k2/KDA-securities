name: Daily official overseas ETF component ingestion

on:
  schedule:
    # GitHub Actions cron is UTC: weekdays 03:40 UTC is 12:40 KST.
    - cron: "40 3 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-overseas-etf-component-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --locked
      - name: Refresh official overseas ETF component TOP3 snapshots
        run: >-
          uv run python -m
          backend.app.ingestion.official_etf_component_snapshots
