name: Daily NAVER market news ingestion

on:
  schedule:
    - cron: "17 3 * * *"
      timezone: "Asia/Seoul"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naver-market-news-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NAVER_API_HUB_CLIENT_ID: ${{ secrets.NAVER_API_HUB_CLIENT_ID }}
      NAVER_API_HUB_CLIENT_SECRET: ${{ secrets.NAVER_API_HUB_CLIENT_SECRET }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      NEWS_SUMMARY_MODEL: gemini-3.6-flash
      NEWS_SUMMARY_PROMPT_VERSION: news-summary-v4
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --locked --group embeddings
      - name: Select, summarize and rotate daily market news
        id: market_news
        run: |
          result="$(uv run --group embeddings python -m backend.app.ingestion.naver_market_news)"
          echo "$result"
          echo "result=$result" >> "$GITHUB_OUTPUT"
      - name: Warn when market-news rotation is waiting for a full batch
        if: ${{ fromJSON(steps.market_news.outputs.result).held_for_full_batch }}
        run: >
          echo "::warning::Market-news rotation is holding new articles because
          the active store is full and fewer than 20 summarized articles were ready."
      - name: Report hybrid RAG search quality (informational)
        # Surfaces retrieval-quality drift on the real hybrid path in the daily
        # log. Soft: a regression here must not block news rotation.
        continue-on-error: true
        run: uv run --group embeddings python scripts/measure_search_quality.py
