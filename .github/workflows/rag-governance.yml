name: Weekly approved RAG governance

on:
  schedule:
    # GitHub cron is UTC: Monday 00:15 UTC is Monday 09:15 KST.
    - cron: "15 0 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: approved-rag-governance
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --locked
      - name: Restore latest official-source fingerprint state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p output/rag-governance
          artifact_id="$(gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=rag-source-fingerprints&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [ -n "$artifact_id" ]; then
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              > output/rag-governance/previous.zip
            unzip -o output/rag-governance/previous.zip -d output/rag-governance
          fi
      - name: Check review dates and official-source fingerprints
        id: check
        run: |
          set -euo pipefail
          state_args=()
          if [ -f output/rag-governance/source-state.json ]; then
            state_args=(--state-in output/rag-governance/source-state.json)
          fi
          uv run python scripts/check_knowledge_freshness.py \
            "${state_args[@]}" \
            --state-out output/rag-governance/source-state.json \
            --report output/rag-governance/report.json \
            --markdown-output output/rag-governance/summary.md
          echo "requires_review=$(jq -r '.requires_review' output/rag-governance/report.json)" \
            >> "$GITHUB_OUTPUT"
      - name: Preserve governance state and report
        uses: actions/upload-artifact@v4
        with:
          name: rag-source-fingerprints
          path: |
            output/rag-governance/source-state.json
            output/rag-governance/report.json
            output/rag-governance/summary.md
          retention-days: 90
      - name: Open or resolve the human-review issue
        uses: actions/github-script@v7
        env:
          REQUIRES_REVIEW: ${{ steps.check.outputs.requires_review }}
        with:
          script: |
            const fs = require('fs');
            const title = '[RAG] 공식 출처 및 검토기한 점검';
            const body = fs.readFileSync('output/rag-governance/summary.md', 'utf8');
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (process.env.REQUIRES_REVIEW === 'true') {
              if (existing) {
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              } else {
                await github.rest.issues.create({ owner, repo, title, body });
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `${body}\n\n현재 점검 신호가 모두 해소되어 자동으로 닫습니다.`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, state: 'closed',
                state_reason: 'completed',
              });
            }
