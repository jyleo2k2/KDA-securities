name: session-policy

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: session-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-session-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # PR head가 검사 스크립트나 정책을 무력화해도 base의 신뢰된 검사기를 실행한다.
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate branch ownership and hotspot overlap
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -f scripts/check_pr_session_policy.py ]; then
            python scripts/check_pr_session_policy.py
          else
            echo "[session-policy] bootstrap PR: base에 검사기가 없어 수동 검증을 사용합니다."
          fi
